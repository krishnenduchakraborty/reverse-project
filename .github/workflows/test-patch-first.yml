name: Test apply patch to Zig

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  test-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install git and python
        run: |
          sudo apt update
          sudo apt install -y git python3

      - name: Clone zig shallow
        run: |
          mkdir -p work
          git clone --depth 1 https://github.com/ziglang/zig.git work/zig-src
          echo "Cloned zig into work/zig-src"

      - name: Apply patch from repo (with fallback)
        run: |
          set -euo pipefail
          REPO_ROOT=$GITHUB_WORKSPACE
          PATCH_PATH="$REPO_ROOT/patches/avoid-mrs.patch"
          echo "Looking for patch at: $PATCH_PATH"
          if [ ! -f "$PATCH_PATH" ]; then
            echo "PATCH NOT FOUND"; ls -la "$REPO_ROOT" || true; exit 1
          fi
          cd work/zig-src
          echo "Trying git apply --reject --whitespace=fix $PATCH_PATH"
          if git apply "$PATCH_PATH"; then
            echo "Patch applied successfully via git apply"
          else
            echo "git apply failed, attempting fallback python patcher"
            cd $REPO_ROOT
            python3 scripts/ci_patch_apply.py || { echo "fallback patcher failed"; exit 1; }
            echo "Fallback patcher succeeded"
          fi
          cd -

      - name: Verify patched file
        run: |
          grep -n "getAArch64CpuFeature" work/zig-src/lib/std/zig/system/linux.zig || true
