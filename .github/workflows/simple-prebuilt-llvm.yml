name: Simple Build Zig (prebuilt LLVM)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup basic deps
        run: |
          sudo apt update
          sudo apt install -y curl tar unzip python3 python3-pip
          python3 -m pip install --upgrade pip setuptools

      - name: Download Android NDK
        run: |
          mkdir -p ${{ github.workspace }}/work
          NDK_VER=r25b
          curl -sSL https://dl.google.com/android/repository/android-ndk-${NDK_VER}-linux.zip -o ndk.zip
          unzip -q ndk.zip -d ${{ github.workspace }}/work
          echo "ANDROID_NDK_HOME=${{ github.workspace }}/work/android-ndk-${NDK_VER}" >> $GITHUB_ENV

      - name: Install LLVM 21 (apt)
        run: |
          sudo apt update
          sudo apt install -y gnupg ca-certificates wget lsb-release
          DIST=$(lsb_release -cs)
          wget -O - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo gpg --dearmour -o /etc/apt/trusted.gpg.d/llvm.gpg
          echo "deb http://apt.llvm.org/${DIST}/ llvm-toolchain-${DIST}-21 main" | sudo tee /etc/apt/sources.list.d/llvm-21.list
          sudo apt update
          sudo apt install -y clang-21 lld-21 liblld-21-dev llvm-21 llvm-21-dev llvm-21-tools libclang-21-dev zlib1g-dev libzstd-dev libxml2-dev
          # Expose paths to the build script
          echo "PREBUILT_LLVM_ROOT=/usr" >> $GITHUB_ENV
          echo "LLVM_CONFIG_EXECUTABLE=/usr/bin/llvm-config-21" >> $GITHUB_ENV
          echo "CLANG_INCLUDE_DIRS=/usr/lib/llvm-21/include" >> $GITHUB_ENV
          echo "LLD_INCLUDE_DIRS=/usr/lib/llvm-21/include" >> $GITHUB_ENV
          echo "LLD_LIBRARIES=/usr/lib/llvm-21/lib/liblld.so" >> $GITHUB_ENV

      - name: Run simplified build script
        env:
          ANDROID_NDK_HOME: ${{ github.workspace }}/work/android-ndk-r25b
          ANDROID_API_LEVEL: 21
        run: |
          echo "PREBUILT_LLVM_ROOT=${PREBUILT_LLVM_ROOT:-<not-set>}"
          ls -la "${PREBUILT_LLVM_ROOT}" || true
          ls -la "${PREBUILT_LLVM_ROOT}/bin" || true
          # Run build and capture logs
          bash scripts/build.sh 2>&1 | tee build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload built zig
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zig-android-aarch64
          path: work/zig-install/bin || work/zig-install
